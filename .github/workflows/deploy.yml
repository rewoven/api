name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check for VPS secrets
        id: cfg
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets not configured - skipping deploy (expected until VPS_HOST/VPS_USER/VPS_SSH_KEY are added)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            source "$HOME/.cargo/env" 2>/dev/null || export PATH="$HOME/.cargo/bin:$PATH"
            git config --global --add safe.directory /opt/rewoven-api
            cd /opt/rewoven-api
            git fetch origin
            git reset --hard origin/main
            cargo build --release
            systemctl restart rewoven-api
            sleep 2
            systemctl is-active rewoven-api
