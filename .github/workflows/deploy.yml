name: Deploy

# Auto-deploys to the VPS on every push to main. Requires three repo secrets
# (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     e.g. 185.197.250.205
#   VPS_USER     e.g. root
#   VPS_SSH_KEY  a private SSH key whose public key is in the VPS authorized_keys
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            source "$HOME/.cargo/env" 2>/dev/null || export PATH="$HOME/.cargo/bin:$PATH"
            git config --global --add safe.directory /opt/rewoven-api
            cd /opt/rewoven-api
            git fetch origin
            git reset --hard origin/main
            cargo build --release            # if this fails, the service is NOT restarted
            systemctl restart rewoven-api
            sleep 2
            systemctl is-active rewoven-api
